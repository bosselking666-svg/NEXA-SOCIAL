<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Social | لوحة الإدارة والمنصة التفاعلية</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="brand">
                <span class="brand-dot"></span>
                <h1>Nexa Social</h1>
            </div>
            <div class="nav-controls">
                <span id="db-status" class="badge badge-warning">جاري الاتصال...</span>
                <button id="btn-open-admin-login" class="btn btn-outline">دخول الأدمن</button>
                <button id="btn-admin-logout" class="btn btn-danger hidden">خروج</button>
            </div>
        </div>
    </header>

    <main class="container main-layout">

        <!-- لوحة تحكم الأدمن (تظهر عند تسجيل الدخول) -->
        <section id="admin-panel" class="admin-section hidden">
            <div class="admin-top-bar">
                <div>
                    <h2>لوحة تحكم الأدمن</h2>
                    <p id="admin-user-info" class="muted-text"></p>
                </div>
                <div class="admin-stats">
                    <span class="badge badge-success">المنشورات: <strong id="stat-posts">0</strong></span>
                    <span class="badge badge-warning">الباسوردات: <strong id="stat-passwords">0</strong></span>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="tab-btn active" data-target="tab-passwords">🔐 خزنة الباسوردات</button>
                <button class="tab-btn" data-target="tab-posts">📝 إدارة المنشورات</button>
            </div>

            <!-- خزنة الباسوردات -->
            <div id="tab-passwords" class="tab-pane active">
                <form id="password-form" class="admin-form">
                    <h3>إضافة باسورد أو مفتاح جديد</h3>
                    <input type="hidden" id="pass-id">
                    <div class="grid-2">
                        <input type="text" id="pass-service" placeholder="اسم الخدمة (مثال: GitHub)" required>
                        <input type="text" id="pass-identifier" placeholder="اسم المستخدم / البريد">
                    </div>
                    <div class="grid-3">
                        <div class="input-with-action">
                            <input type="text" id="pass-secret" placeholder="كلمة المرور" required>
                            <button type="button" id="btn-generate-pass" class="btn btn-sm btn-secondary">توليد</button>
                        </div>
                        <select id="pass-level">
                            <option value="Admin">Admin</option>
                            <option value="Super Admin">Super Admin</option>
                            <option value="VIP">VIP</option>
                        </select>
                        <input type="text" id="pass-notes" placeholder="ملاحظات...">
                    </div>
                    <button type="submit" class="btn btn-primary">حفظ في الخزنة</button>
                </form>

                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>الخدمة</th>
                                <th>الحساب</th>
                                <th>كلمة المرور</th>
                                <th>الصلاحية</th>
                                <th>ملاحظات</th>
                                <th>تحكم</th>
                            </tr>
                        </thead>
                        <tbody id="passwords-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- إدارة المنشورات -->
            <div id="tab-posts" class="tab-pane">
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>الكاتب</th>
                                <th>المحتوى</th>
                                <th>الإعجابات</th>
                                <th>تحكم</th>
                            </tr>
                        </thead>
                        <tbody id="admin-posts-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- المنصة التفاعلية للزوار -->
        <section class="social-section">
            <div class="composer-card">
                <h3>شارك منشوراً جديداً</h3>
                <form id="new-post-form">
                    <div class="grid-3">
                        <input type="text" id="post-author" placeholder="اسمك" required>
                        <input type="text" id="post-handle" placeholder="@username" required>
                        <select id="post-category">
                            <option value="عام">عام</option>
                            <option value="تقنية">تقنية</option>
                        </select>
                    </div>
                    <textarea id="post-content" rows="3" placeholder="بماذا تفكر؟..." required></textarea>
                    <button type="submit" class="btn btn-primary">نشر الآن</button>
                </form>
            </div>

            <div id="posts-feed" class="posts-list">
                <div class="muted-text">جاري تحميل المنشورات...</div>
            </div>
        </section>

    </main>

    <!-- نافذة تسجيل الدخول -->
    <div id="admin-login-modal" class="modal hidden">
        <div class="modal-card">
            <button class="modal-close" id="btn-close-login">&times;</button>
            <h3>دخول لوحة التحكم</h3>
            <form id="admin-login-form">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" required>
                </div>
                <p id="login-error-msg" class="error-msg hidden"></p>
                <button type="submit" class="btn btn-primary btn-block">دخول</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
