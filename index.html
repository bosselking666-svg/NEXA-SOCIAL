<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Social | منصة تفاعلية عصرية</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="brand">
                <span class="brand-dot"></span>
                <h1>Nexa Social</h1>
            </div>
            <div class="nav-controls">
                <span id="db-status" class="badge badge-warning">جاري الاتصال...</span>
                <button id="btn-open-login" class="btn btn-outline btn-sm">حساب / دخول</button>
                <button id="btn-logout" class="btn btn-danger btn-sm hidden">خروج</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 24px;">

        <!-- صندوق إنشاء منشور جديد -->
        <section class="composer-card">
            <h3>شارك فكرتك مع المجتمع</h3>
            <form id="new-post-form">
                <div class="grid-2">
                    <input type="text" id="post-author" placeholder="اسمك الكريم" required>
                    <input type="text" id="post-handle" placeholder="@username" required>
                </div>
                <textarea id="post-content" rows="3" placeholder="ما الذي يجول في خاطرك؟..." required></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <select id="post-category" style="max-width: 150px;">
                        <option value="عام">عام</option>
                        <option value="تقنية">تقنية</option>
                        <option value="نقاش">نقاش</option>
                    </select>
                    <button type="submit" class="btn btn-primary">نشر المنشور</button>
                </div>
            </form>
        </section>

        <!-- موجز المنشورات -->
        <section id="posts-feed" class="posts-list">
            <div class="muted-text" style="text-align: center; padding: 20px;">جاري تحميل المنشورات...</div>
        </section>

    </main>

    <!-- نافذة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-card">
            <button class="modal-close" id="btn-close-auth">&times;</button>
            <h3 id="auth-modal-title" style="margin-bottom: 16px;">تسجيل الدخول</h3>
            
            <form id="auth-form">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="auth-password" required>
                </div>
                <p id="auth-error" class="error-msg hidden"></p>
                <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block" style="margin-top: 10px;">دخول</button>
            </form>
            
            <div class="auth-switch">
                <span id="auth-switch-text">ليس لديك حساب؟ <span id="toggle-auth-mode">إنشاء حساب جديد</span></span>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل منشور -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-card">
            <button class="modal-close" id="btn-close-edit">&times;</button>
            <h3 style="margin-bottom: 16px;">تعديل المنشور</h3>
            <form id="edit-post-form">
                <input type="hidden" id="edit-post-id">
                <div class="form-group">
                    <label>محتوى المنشور</label>
                    <textarea id="edit-post-content" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">حفظ التعديلات</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
