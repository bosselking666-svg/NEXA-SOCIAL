<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Nexa Social</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
</head>
<body>

    <div class="auth-container">
        <div class="card">
            <div style="text-align: center; margin-bottom: 20px;">
                <a href="index.html" style="text-decoration:none; color:var(--primary); font-weight:900; font-size:1.5rem;">Nexa Social</a>
                <p class="muted-text" style="margin-top: 6px;">تسجيل الدخول المباشر لحسابك</p>
            </div>

            <div id="login-alert" class="alert hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">دخول مباشر</button>
            </form>

            <!-- قائمة الحسابات المحفوظة للتبديل السريع -->
            <div id="saved-accounts-box" class="hidden" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 14px;">
                <p class="muted-text" style="margin-bottom: 8px; font-weight:bold;">حسابات مسجلة على هذا الجهاز:</p>
                <div id="saved-accounts-list" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                ليس لديك حساب؟ <a href="register.html" style="color: var(--primary); font-weight: 700;">إنشاء حساب جديد</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const sb = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.ANON_KEY);
        const loginAlert = document.getElementById('login-alert');

        // عرض الحسابات المحفوظة مسبقاً لتسهيل تعدد الحسابات
        const savedEmails = JSON.parse(localStorage.getItem('nexa_saved_emails') || '[]');
        if (savedEmails.length > 0) {
            document.getElementById('saved-accounts-box').classList.remove('hidden');
            document.getElementById('saved-accounts-list').innerHTML = savedEmails.map(em => `
                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('login-email').value='${em}'">
                    👤 ${em}
                </button>
            `).join('');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // تسجيل الخروج من أي جلسة سابقة للسماح بتبديل الحسابات بحرية
            await sb.auth.signOut();

            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                loginAlert.textContent = 'بيانات الدخول غير صحيحة: ' + error.message;
                loginAlert.className = 'alert alert-error';
                loginAlert.classList.remove('hidden');
                return;
            }

            // حفظ البريد في قائمة تعدد الحسابات المحلية
            if (!savedEmails.includes(email)) {
                savedEmails.push(email);
                localStorage.setItem('nexa_saved_emails', JSON.stringify(savedEmails));
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
