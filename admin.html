<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن | Nexa Social</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="brand">
                <span class="brand-dot"></span>
                <h1>لوحة تحكم الأدمن 🛡️</h1>
            </a>
            <a href="index.html" class="btn btn-secondary btn-sm">← العودة للموقع</a>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h3>إدارة الأعضاء والصلاحيات</h3>
            <p class="muted-text">يمكنك ترقية أي عضو إلى أدمن أو إدارته من هنا.</p>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>اسم المستخدم</th>
                        <th>الصلاحية الحالية</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="admin-users-table"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>إدارة جميع المنشورات في المجتمع</h3>
            <table>
                <thead>
                    <tr>
                        <th>الكاتب</th>
                        <th>المحتوى</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="admin-posts-table"></tbody>
            </table>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const sb = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.ANON_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            const { data: prof } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
            if (prof?.role !== 'admin' && session.user.email !== SUPABASE_CONFIG.ADMIN_EMAIL) {
                alert('غير مصرح لك بدخول لوحة تحكم الأدمن.');
                window.location.href = 'index.html';
                return;
            }
            await loadAdminData();
        });

        async function loadAdminData() {
            const [usersRes, postsRes] = await Promise.all([
                sb.from('profiles').select('*'),
                sb.from('posts').select('*').order('created_at', { ascending: false })
            ]);

            document.getElementById('admin-users-table').innerHTML = (usersRes.data || []).map(u => `
                <tr>
                    <td>${u.full_name}</td>
                    <td>@${u.username}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-warning'}">${u.role === 'admin' ? 'أدمن' : 'مستخدم عادي'}</span></td>
                    <td>
                        ${u.role !== 'admin' ? `<button class="btn btn-sm btn-primary" onclick="setRole('${u.id}', 'admin')">ترقية لأدمن</button>` : 
                        `<button class="btn btn-sm btn-secondary" onclick="setRole('${u.id}', 'user')">إلغاء الأدمن</button>`}
                    </td>
                </tr>
            `).join('');

            document.getElementById('admin-posts-table').innerHTML = (postsRes.data || []).map(p => `
                <tr>
                    <td>${p.author_name}</td>
                    <td>${(p.content || '').substring(0, 60)}...</td>
                    <td><button class="btn btn-sm btn-danger" onclick="adminDeletePost('${p.id}')">حذف نهائي</button></td>
                </tr>
            `).join('');
        }

        window.setRole = async (uid, role) => {
            await sb.from('profiles').update({ role }).eq('id', uid);
            await loadAdminData();
        };

        window.adminDeletePost = async (pid) => {
            if (!confirm('حذف المنشور نهائياً؟')) return;
            await sb.from('posts').delete().eq('id', pid);
            await loadAdminData();
        };
    </script>
</body>
</html>
